name: Build and Release

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release version
        required: true
        default: "25.12.4"
      openwrt_target:
        description: OpenWrt target
        required: true
        default: "x86"
      openwrt_subtarget:
        description: OpenWrt subtarget
        required: true
        default: "64"
      legacy_openwrt_version:
        description: Legacy OpenWrt release version for IPK builds
        required: true
        default: "24.10.7"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PACKAGE_NAME: luci-app-fanxpert
  OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.4' }}
  LEGACY_OPENWRT_VERSION: ${{ github.event.inputs.legacy_openwrt_version || '24.10.7' }}
  OPENWRT_TARGET: ${{ github.event.inputs.openwrt_target || 'mediatek' }}
  OPENWRT_SUBTARGET: ${{ github.event.inputs.openwrt_subtarget || 'filogic' }}

jobs:
  build:
    name: Build ${{ matrix.channel }} package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: release-apk
            package_glob: "*.apk"
          - channel: legacy-ipk
            package_glob: "*.ipk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            file \
            zstd

      - name: Resolve SDK URL
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.channel }}" = "legacy-ipk" ]; then
            base_url="https://downloads.openwrt.org/releases/${LEGACY_OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
            version_label="${LEGACY_OPENWRT_VERSION}"
          else
            base_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
            version_label="${OPENWRT_VERSION}"
          fi

          sdk_name="$(wget -qO- "${base_url}/sha256sums" \
            | awk '/openwrt-sdk-.*Linux-x86_64\.tar\.(xz|zst)$/ { gsub(/^\*/, "", $2); print $2; exit }')"

          if [ -z "${sdk_name}" ]; then
            echo "Unable to find SDK in ${base_url}/sha256sums" >&2
            exit 1
          fi

          echo "base_url=${base_url}" >> "$GITHUB_OUTPUT"
          echo "version_label=${version_label}" >> "$GITHUB_OUTPUT"
          echo "sdk_name=${sdk_name}" >> "$GITHUB_OUTPUT"
          echo "sdk_url=${base_url}/${sdk_name}" >> "$GITHUB_OUTPUT"

      - name: Download and verify OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail

          wget -q "${{ steps.sdk.outputs.sdk_url }}"
          wget -q "${{ steps.sdk.outputs.base_url }}/sha256sums"
          grep "${{ steps.sdk.outputs.sdk_name }}" sha256sums | sha256sum -c -

      - name: Extract SDK
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          case "${{ steps.sdk.outputs.sdk_name }}" in
            *.tar.xz)
              tar -xf "${{ steps.sdk.outputs.sdk_name }}"
              ;;
            *.tar.zst)
              tar --zstd -xf "${{ steps.sdk.outputs.sdk_name }}"
              ;;
            *)
              echo "Unsupported SDK archive: ${{ steps.sdk.outputs.sdk_name }}" >&2
              exit 1
              ;;
          esac

          sdk_dir="$(find "$PWD" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)"
          if [ -z "${sdk_dir}" ]; then
            echo "Unable to locate extracted SDK directory" >&2
            exit 1
          fi

          echo "sdk_dir=${sdk_dir}" >> "$GITHUB_OUTPUT"

      - name: Install package into SDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_dir="${{ steps.extract.outputs.sdk_dir }}"
          mkdir -p "${sdk_dir}/package/luci-app-fanxpert"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            luci-app-fanxpert/ \
            "${sdk_dir}/package/luci-app-fanxpert/"

      - name: Update feeds
        working-directory: ${{ steps.extract.outputs.sdk_dir }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure package
        working-directory: ${{ steps.extract.outputs.sdk_dir }}
        run: |
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-fanxpert=m" >> .config
          make defconfig

      - name: Build package
        working-directory: ${{ steps.extract.outputs.sdk_dir }}
        run: make package/luci-app-fanxpert/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          sdk_dir="${{ steps.extract.outputs.sdk_dir }}"
          out_dir="$PWD/dist"
          mkdir -p "${out_dir}"

          find "${sdk_dir}/bin/packages" -type f -name 'luci-app-fanxpert_*.ipk' -exec cp -v {} "${out_dir}/" \;
          find "${sdk_dir}/bin/packages" -type f -name 'luci-app-fanxpert_*.apk' -exec cp -v {} "${out_dir}/" \;

          if ! ls "${out_dir}"/${{ matrix.package_glob }} >/dev/null 2>&1; then
            echo "No ${{ matrix.package_glob }} package found for ${{ matrix.channel }} build" >&2
            echo "Available files:" >&2
            find "${out_dir}" -type f -maxdepth 1 -print >&2
            exit 1
          fi

          if ! ls "${out_dir}"/luci-app-fanxpert_*.*pk >/dev/null 2>&1; then
            echo "No luci-app-fanxpert package found" >&2
            exit 1
          fi

          (cd "${out_dir}" && sha256sum *.*pk > SHA256SUMS)
          echo "dist=${out_dir}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-fanxpert-${{ matrix.channel }}-${{ steps.sdk.outputs.version_label }}-${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          find release-assets -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp -v {} dist/ \;

          if ! ls dist/luci-app-fanxpert_*.ipk >/dev/null 2>&1; then
            echo "Missing legacy .ipk package" >&2
            exit 1
          fi

          if ! ls dist/luci-app-fanxpert_*.apk >/dev/null 2>&1; then
            echo "Missing release .apk package" >&2
            exit 1
          fi

          (cd dist && sha256sum *.*pk > SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.*pk
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
